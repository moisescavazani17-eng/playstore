name: Build Play Store

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Enviar APK/AAB para GitHub Artifacts"
        required: false
        default: false
        type: boolean
      require_signing:
        description: "Exigir assinatura de produção"
        required: false
        default: false
        type: boolean
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-playstore.yml"

permissions:
  contents: write

concurrency:
  group: build-playstore-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYSTORE_KEYSTORE_B64: ${{ secrets.PLAYSTORE_KEYSTORE_B64 }}
      PLAYSTORE_KEYSTORE_PASSWORD: ${{ secrets.PLAYSTORE_KEYSTORE_PASSWORD }}
      PLAYSTORE_KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
      PLAYSTORE_KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
      PLAYSTORE_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Manter assinatura do APK de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: playstore-test-debug-keystore-v1

      - name: Preparar chave de upload
        shell: bash
        run: |
          if [ -n "$PLAYSTORE_KEYSTORE_B64" ]; then
            printf '%s' "$PLAYSTORE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/playstore-upload.jks"
            echo "PLAYSTORE_KEYSTORE_PATH=$RUNNER_TEMP/playstore-upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Validar assinatura obrigatória
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_signing }}
        shell: bash
        run: |
          test -n "$PLAYSTORE_KEYSTORE_B64"
          test -n "$PLAYSTORE_KEYSTORE_PASSWORD"
          test -n "$PLAYSTORE_KEY_ALIAS"
          test -n "$PLAYSTORE_KEY_PASSWORD"
          test -f "$RUNNER_TEMP/playstore-upload.jks"

      - name: Compilar APK de teste e AAB
        run: gradle assembleDebug bundleRelease

      - name: Analisar configuração do R8
        run: gradle :app:analyzeReleaseR8Config

      - name: Validar arquivos gerados
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          test -f app/build/outputs/mapping/release/mapping.txt
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/mapping/release/mapping.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/mapping/release/mapping.txt

      - name: Disponibilizar AAB para assinatura local
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: Vezora-Unsigned-AAB-For-Signing
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

      - name: Publicar APK de teste mais recente
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Vezora-Teste.apk
          cp app/build/outputs/bundle/release/app-release.aab Vezora-Unsigned.aab
          cp app/build/outputs/mapping/release/mapping.txt Vezora-Mapping.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if gh release view teste-atual >/dev/null 2>&1; then
            git tag -f teste-atual "$GITHUB_SHA"
            git push origin refs/tags/teste-atual --force
            gh release upload teste-atual Vezora-Teste.apk Vezora-Unsigned.aab Vezora-Mapping.txt --clobber
            gh release edit teste-atual               --title "Vezora - APK de teste mais recente"               --prerelease               --notes "APK de teste gerado automaticamente a partir do commit $GITHUB_SHA. Não é o AAB de produção da Google Play."
          else
            gh release create teste-atual Vezora-Teste.apk Vezora-Unsigned.aab Vezora-Mapping.txt               --target "$GITHUB_SHA"               --title "Vezora - APK de teste mais recente"               --prerelease               --notes "APK de teste gerado automaticamente a partir do commit $GITHUB_SHA. Não é o AAB de produção da Google Play."
          fi

      - name: Guardar APK de teste
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: Vezora-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Guardar AAB da Play Store
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: Vezora-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

      - name: Apagar chave temporária
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/playstore-upload.jks"
